[project]
name = "pyscryfall"
version = "0.1.0"
description = "Python library to search Magic The Gathering cards information on scryfall.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
]

classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
